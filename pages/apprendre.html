<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Apprendre les Pokémons</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/apprendre.css" />
    <!-- Chargement de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body class="bg-light">

    <!-- Conteneur principal Bootstrap -->
    <div class="container my-5">
        
        <!-- Titre -->
        <div class="row mb-4">
            <div class="col">
                <h1 class="text-center pokemon-title my-4">Apprendre les Pokémons</h1>
            </div>
        </div>

        <!-- Zone de filtrage (Grille Bootstrap) -->
        <div class="row align-items-end p-4 shadow-sm mb-4 pokedex-container">
            
            <!-- Image d'illustration -->
            <div class="col-md-2 text-center mb-3 mb-md-0">
                <img src="https://assets.tcgdex.net/fr/base/base1/58/high.png" alt="Pokemon" class="img-fluid rounded" style="max-height: 100px;" />
            </div>

            <!-- Sélecteur de thématique -->
            <div class="col-md-7 mb-3 mb-md-0">
                <label for="thematique" class="form-label fw-semibold">Filtrer par thématique :</label>
                <select id="thematique" class="form-select form-select-lg border-primary">
                    <option value="Tout">Tout</option>
                    <option value="Terre">Terre</option>
                    <option value="Eau">Eau</option>
                    <option value="Air">Air</option>
                    <option value="Feu">Feu</option>
                </select>
            </div>

            <!-- Bouton -->
            <div class="col-md-3">
                <button type="button" id="btn-filtrer" class="btn btn-pokemon btn-lg w-100">
                         Appliquer le filtre
                </button>
            </div>
        </div>

        <!-- Tableau -->
        <div class="table-responsive shadow-sm rounded bg-white">
            <table id="data" class="table table-striped table-hover table-bordered align-middle mb-0 text-center">
                <!-- Le JS insérera les lignes ici -->
            </table>
        </div>

    </div>

    <!-- Scripts -->
    <script type="module" src="../scripts/apprendre.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
